# The app is plain static files in public/ (no build step). One serverless function (netlify/functions/ai.mjs)
# powers the AI features and keeps your Anthropic API key off the phone. HTTPS is required for the
# service worker, "install to home screen" and GPS, and Netlify provides it automatically.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"            # keep your private trip out of search engines
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

# Make sure phones always pick up app updates promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
